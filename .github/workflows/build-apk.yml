name: Build Debug APK (dari HOME-WITH-HER.zip)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ekstrak proyek dari HOME-WITH-HER.zip
        run: |
          test -f HOME-WITH-HER.zip || {
            echo "HOME-WITH-HER.zip tidak ditemukan di root repository"
            exit 1
          }
          mkdir -p project
          unzip -q HOME-WITH-HER.zip -d project
          echo "Isi ZIP:"
          ls -la project
          echo "Mencari settings.gradle.kts:"
          find project -name settings.gradle.kts

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Temukan root proyek Android
        shell: bash
        run: |
          SETTINGS=$(find project -type f \
            -name settings.gradle.kts -print -quit)

          if [ -z "$SETTINGS" ]; then
            SETTINGS=$(find project -type f \
              -name settings.gradle -print -quit)
          fi

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: File settings.gradle(.kts) tidak ditemukan."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Root proyek: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HOME-WITH-HER-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload laporan build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HOME-WITH-HER-build-reports
          path: project/**/build/reports/
          if-no-files-found: ignore
